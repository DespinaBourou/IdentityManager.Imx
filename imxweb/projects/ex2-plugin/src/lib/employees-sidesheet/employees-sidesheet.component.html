
<mat-form-field appearance="outline" class="inputbox" style="width:240px" >
    <mat-label> Custom Property 01</mat-label>
    <input placeholder="Custom Propery 01" type="text" matInput [formControl]="customproperty01">
</mat-form-field>

<eui-date-picker [dateControl]="exitdate" 
placeholder="Exit Date" label="Exit Date" [allowTextInput]="false" [useClearIcon]="true" class="euidatepicker" [min]="entrydate" ></eui-date-picker>

<button mat-flat-button color="primary" style="width:100px" (click)="updateEmployeeData()"> Submit </button>
